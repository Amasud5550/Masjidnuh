<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin access needed | Masjid Nuh</title>
<link rel="icon" href="/assets/mark.png">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Zilla+Slab:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0D2B3A;color:#E9F1F1;font:16px/1.6 "Public Sans",system-ui,sans-serif;padding:24px;box-sizing:border-box}
main{max-width:440px;text-align:center}
img{width:84px;margin:0 auto 22px;display:block}
h1{font:600 2rem/1.15 "Zilla Slab",Georgia,serif;margin:0 0 12px;color:#fff}
p{color:#A9C1C6;margin:0 0 10px}
b{color:#fff;font-weight:600}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
a{text-decoration:none;font-weight:600;padding:12px 20px;border-radius:999px}
.primary{background:#D08A54;color:#1B1007}
.ghost{border:1px solid rgba(255,255,255,.3);color:#E9F1F1}
a:focus-visible{outline:3px solid #D08A54;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/assets/mark.png" alt="">
  <h1>This account isn’t an admin yet</h1>
  <p>You’re signed in as <b id="who">your Microsoft account</b>, but it hasn’t been given access to the Masjid Nuh dashboard.</p>
  <p id="how">Ask a masjid admin to give your account access, then sign in again.</p>
  <div class="row">
    <a class="primary" href="/auth/logout?next=/auth/login">Use a different account</a>
    <a class="ghost" href="/">Back to the website</a>
  </div>
</main>
<script>
fetch('/api/me').then(r => r.json()).then(j => {
  if (j.signedIn) document.getElementById('who').textContent = j.email;
  if (j.accessMode === 'groups') document.getElementById('how').textContent = 'Access is limited to members of the masjid’s website admin group in Microsoft 365. Ask your Microsoft 365 admin to add you to that group, then use a different account or sign in again.';
}).catch(() => {});
</script>
</body>
</html>
